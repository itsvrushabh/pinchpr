name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pinch-pr-linux-x86_64.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/pinch-pr
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pinch-pr-macos-arm64.tar.gz
            binary: target/aarch64-apple-darwin/release/pinch-pr

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --bin pinch-pr --target ${{ matrix.target }}

      - name: Package Release
        run: |
          tar -czf ${{ matrix.artifact_name }} -C $(dirname ${{ matrix.binary }}) pinch-pr

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
